apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        demo.gitops/content-version: "v2"
    spec:
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - name: http
              containerPort: 80
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NGINX_ENVSUBST_OUTPUT_DIR
              value: /usr/share/nginx/html
            - name: NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE
              value: "1"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
          volumeMounts:
            - name: content
              mountPath: /etc/nginx/templates
              readOnly: true
            - name: assets
              mountPath: /usr/share/nginx/html/assets
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: {{ .Release.Name }}-content
        - name: assets
          configMap:
            name: {{ .Release.Name }}-assets
