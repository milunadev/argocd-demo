apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-plain
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/milunadev/argocd-demo.git
    targetRevision: main
    path: apps/plain/web
  destination:
    server: https://kubernetes.default.svc
    namespace: web-demo
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
