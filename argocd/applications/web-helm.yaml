apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-helm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/milunadev/argocd-demo.git
    targetRevision: main
    path: apps/helm/gitops-web
    helm:
      releaseName: web-helm
  destination:
    server: https://kubernetes.default.svc
    namespace: helm-demo
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
