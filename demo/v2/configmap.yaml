apiVersion: v1
kind: ConfigMap
metadata:
  name: web-content
  labels:
    app: web
data:
  index.html.template: |
    <!DOCTYPE html>
    <html lang="es">
    <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitOps en acción</title>
    <style>
    *{box-sizing:border-box}body{margin:0;background:#faf7f2;color:#252936;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(760px,92vw);margin:30px auto 40px}.top{display:flex;align-items:center;gap:12px;justify-content:space-between}.eyebrow{font-size:12px;letter-spacing:.12em;font-weight:750;color:#8b6c52}.version{font-size:13px;background:#efe8ff;color:#674b9c;padding:6px 12px;border-radius:30px;font-weight:750}
    h1{font-size:clamp(24px,4vw,36px);letter-spacing:-.04em;margin:14px 0 8px}.pod{display:block;overflow-wrap:anywhere;color:#596477;font-size:14px;margin:0 0 25px}.frame{width:min(100%,calc(100svh - 240px));min-width:280px;margin-inline:auto;position:relative;border-radius:24px;overflow:hidden;background:white;box-shadow:0 8px 35px #473d2c15;isolation:isolate}.frame img{display:block;width:100%;height:auto}.label{position:absolute;padding:8px 17px;border:2px solid white;border-radius:30px;font-size:clamp(13px,2.4vw,20px);font-weight:800;box-shadow:0 3px 12px #0003;white-space:nowrap}.argo{left:35%;top:7%;background:#ed7947;color:#fff}.git{left:20%;bottom:8%;background:#fff3e7;color:#ad482a}.cluster{right:8%;bottom:8%;background:#ecf3ff;color:#285ab4}footer{text-align:center;font-size:15px;line-height:1.6;color:#626678;margin:22px 12px 0}
    </style></head>
    <body><main><div class="top"><span class="eyebrow">KUBERNETES + GITOPS</span><span class="version">v2</span></div><h1>Welcome from Pod</h1><code class="pod">${POD_NAME}</code><div class="frame"><img src="/assets/dog.png" alt="Un perro grande acerca dos figuritas de perros pequeños"><span class="label argo">Argo CD</span><span class="label git">Git</span><span class="label cluster">Kubernetes</span></div><footer>Argo CD mantiene el clúster alineado con Git.</footer></main></body></html>
